function refreshHUD(){if(!game)return;const c=ccur();if(!c)return;const visual=gearVisual(c),hero=$('hero');if(hero){hero.classList.remove('weapon7','weapon10','armor7','armor8','armor9','armor10');if(visual.weapon>=10)hero.classList.add('weapon10');else if(visual.weapon>=7)hero.classList.add('weapon7');if(visual.armor>=7)hero.classList.add('armor'+Math.min(10,visual.armor))};const d=derived(c),e=c.enemy;const set=(id,v)=>{const n=$(id);if(n)n.textContent=v};set('lv',c.level);set('status',c.hunting?'🟢 자동사냥 중':'⚪ 대기');set('hptext',fmt(Math.max(0,c.hp))+' / '+fmt(d.maxHp));set('potred',fmt(count(c,'red'))+'개');set('potorange',fmt(count(c,'orange'))+'개');set('potclear',fmt(count(c,'clear'))+'개');set('weightPct',(100*weight(c)/Math.max(1,d.maxWeight)).toFixed(1)+'%');set('potionThreshold','HP '+c.settings.hpThreshold+'% 이하 자동 사용');set('buffStatus',[c.speedBuff?.remaining>0?ITEMS[c.speedBuff.type]?.name+' '+buffTime(c.speedBuff.remaining):'',c.braveryBuff?.remaining>0?(c.cls==='요정'?'엘븐 와퍼':'용기의 물약')+' '+buffTime(c.braveryBuff.remaining):''].filter(Boolean).join(' · ')||'버프 없음');set('gold',fmt(c.gold)+' G');set('xptext',Math.floor(c.xp/xpNeeded(c.level)*100)+'% · 다음 레벨까지 '+fmt(xpNeeded(c.level)-c.xp)+' XP');set('weight','물약 무게 '+fmt(weight(c))+' / '+fmt(d.maxWeight));const wf=$('weightFill');if(wf)wf.style.width=clamp(weight(c)/Math.max(1,d.maxWeight)*100,0,100)+'%';set('zoneLabel','📍 '+ZONES[c.zone][0]);const arena=$('arena');if(arena)arena.dataset.zone=c.zone;set('tickets',c.tickets);set('enemyName',e?.name||'사냥 대기');const eg=$('enemyGlyph');if(eg){const en=e?.name||'고블린';if(eg.dataset.monster!==en){eg.innerHTML=pixelEnemy(en);eg.dataset.monster=en}}const bar=(id,p)=>{const n=$(id);if(n)n.style.width=clamp(p,0,100)+'%'};bar('hpbar',c.hp/d.maxHp*100);bar('xpbar',c.xp/xpNeeded(c.level)*100);bar('enemyBar',e?e.hp/e.maxHp*100:0);const btn=$('huntbtn');if(btn)btn.textContent=c.hunting?'■ 자동사냥 중지':'▶ 자동사냥 시작';const lg=$('combatlog');if(lg){const newest=c.logs[0]||'';if(lg.dataset.last!==newest){lg.innerHTML=c.logs.slice(0,75).map(s=>`<div>${esc(s)}</div>`).join('');lg.dataset.last=newest}}}

else if(type==='equip'){const d=derived(c);b.innerHTML=`<div class="statgrid equip-grid">${SLOTIDS.map(slot=>{const equipped=c.inv.find(x=>x.uid===c.equip[slot]);return `<div class="equip-slot"><b>${SLOTNAMES[slot]}</b><div class="equip-line"><span>${equipped?itemName(equipped):'—'}</span>${equipped?`<button onclick="unequip('${slot}')">해제</button>`:''}</div></div>`}).join('')}</div><p>AC: −${d.ac} · 최대 HP: ${d.maxHp} · 최대 물약 무게: ${d.maxWeight}</p>`}

  if(it.id.startsWith('b')){lines.push('<div class="tip-line tip-highlight">기본 화살 무제한 (요정)</div>');lines.push('<div class="tip-line">기본 화살 추가 피해 +10</div>')}
  lines.push(`<div class="tip-line tip-dim">강화 추가 피해 +${enh} · 실제 전투 적용</div>`)
 }else if(it.ac){lines.push(`<div class="tip-line">AC −${it.ac} −${enh} (최종 −${it.ac+enh})</div>`)}
 if(it.bonus)lines.push(`<div class="tip-line">${statLabel(it.bonus)} ${it.bonus==='AC'?'−':'+'}${it.bonusValue}</div>`);
 if(enhancedMR(x,it))lines.push(`<div class="tip-line tip-highlight">강화 마법방어 +${enhancedMR(x,it)} (기본 MR 별도)</div>`);if(it.bonus2)lines.push(`<div class="tip-line">${statLabel(it.bonus2)} +${it.bonusValue2}</div>`);
 if(it.slot==='consumable'&&it.id==='wafer')lines.push('<div class="tip-line">공격속도 ×2 · 5분 · 요정 전용</div>');
 if(it.slot==='consumable'&&it.id==='bravery')lines.push('<div class="tip-line">공격속도 ×2 · 5분 · 기사 전용</div>');
 if(it.slot==='consumable'&&['green','enhgreen'].includes(it.id))lines.push(`<div class="tip-line">공격속도 ×2 · ${it.id==='green'?'5':'30'}분</div>`);
 if(it.slot==='consumable'&&['red','orange','clear'].includes(it.id))lines.push(`<div class="tip-line">HP 회복 ${ {red:'20~40',orange:'80~120',clear:'200~300'}[it.id]}</div>`);
 if(it.class)lines.push(`<div class="tip-line">착용 가능 : ${it.class}</div>`);
 if(it.slot!=='consumable'&&it.slot!=='scroll'&&it.slot!=='material')lines.push(`<div class="tip-line tip-dim">등급 ${['일반','고급','희귀','영웅'][it.rarity||0]} · ${SLOTNAMES[it.slot]||it.slot}</div>`);
 if(Object.values(c.equip).includes(x.uid))lines.push('<div class="tip-line tip-equipped">[장착 중]</div>');
 return lines.join('');
}
function statLabel(key){return ({HP:'최대 HP',MP:'최대 MP',MR:'마법 저항',AC:'AC',STR:'STR',DEX:'DEX',INT:'INT',FIRE:'화염 저항',WEIGHT:'물약 최대 무게',RANGED_HIT:'원거리 명중',MELEE_HIT:'근거리 명중',RANGED_DMG:'원거리 추가 피해'})[key]||key}
function itemDetail(uid){modal='item-detail';const c=ccur(),x=c.inv.find(i=>i.uid===uid);if(!x)return;const it=ITEMS[x.id];const actions=[];if(['green','enhgreen','bravery','wafer'].includes(x.id))actions.push(`<button onclick="useSpeedPotion('${x.id}')">사용</button>`);if(['weapon','helmet','armor','shirt','cloak','gloves','boots','shield','ring','necklace','belt'].includes(it.slot))actions.push(Object.values(c.equip).includes(uid)?`<button onclick="unequipFromInventory('${uid}')">장착 해제</button>`:`<button onclick="equipItem('${uid}')">장착</button>`);if(!Object.values(c.equip).includes(uid))actions.push(`<button onclick="sellItem('${uid}')">판매</button>`);actions.push(`<button onclick="lockItem('${uid}')">${x.locked?'잠금 해제':'잠금'}</button>`);$('modalBody').innerHTML=`<div class="classic-item-panel"><div class="tip-title">${x.enh?'+'+x.enh+' ':''}${esc(it.name)}</div>${itemTooltipLines(x,it,c)}</div><div class="item-actions">${actions.join(' ')}</div><button onclick="renderModal('inventory')">← 인벤토리로</button>`}
function useSpeedPotion(id){const c=ccur();if(!['green','enhgreen','bravery','wafer'].includes(id)||count(c,id)<1)return toast('물약이 없습니다');if(id==='bravery'&&c.cls!=='기사')return toast('용기의 물약은 기사만 사용할 수 있습니다');if(id==='wafer'&&c.cls!=='요정')return toast('엘븐 와퍼는 요정만 사용할 수 있습니다');consume(c,id);if(id==='bravery'||id==='wafer')c.braveryBuff={remaining:300,type:id};else c.speedBuff={type:id,remaining:id==='green'?300:1800};persist(true);openModal('inventory');toast(ITEMS[id].name+' 사용')}
function equipItem(uid){const c=ccur(),x=c.inv.find(i=>i.uid===uid),it=ITEMS[x?.id];if(!it)return;if(it.class&&it.class!==c.cls)return toast('직업 제한 장비입니다');let slot=it.slot;if(slot==='ring')slot=!c.equip.ring1?'ring1':!c.equip.ring2?'ring2':'ring1';if(slot==='shield'&&c.equip.weapon&&ITEMS[c.inv.find(y=>y.uid===c.equip.weapon)?.id]?.name?.includes('활'))return toast('활 착용 중 방패 사용 불가');if(slot==='weapon'&&it.name.includes('활'))delete c.equip.shield;c.equip[slot]=uid;healMax(c);persist(true);openModal('inventory')}
function unequipFromInventory(uid){const c=ccur();for(const slot in c.equip)if(c.equip[slot]===uid)delete c.equip[slot];healMax(c);persist(true);openModal('inventory')}
function unequip(slot){const c=ccur();delete c.equip[slot];healMax(c);persist(true);openModal('equip')}
function saleUnit(x){const it=ITEMS[x.id],base=Math.floor((it.price||0)*.5);if(['consumable','material','scroll','ticket'].includes(it.slot))return base;return Math.floor(base*([1,1.5,2.5,5][it.rarity||0]||1))}
function sellItem(uid,fromShop=false){const c=ccur(),x=c.inv.find(i=>i.uid===uid);if(!x||x.locked||Object.values(c.equip).includes(uid))return toast('장착 또는 잠금 아이템은 판매할 수 없습니다');let sold=x.qty;if(x.qty>1){const raw=prompt(`${ITEMS[x.id].name} 판매 수량 (1~${x.qty})`,String(x.qty));if(raw===null)return;const n=Number(raw);if(!Number.isInteger(n)||n<1||n>x.qty)return toast('판매 수량이 올바르지 않습니다');sold=n}const amount=saleUnit(x)*sold;c.gold+=amount;c.statsLife.sales=(c.statsLife.sales||0)+amount;x.qty-=sold;if(x.qty<=0)c.inv.splice(c.inv.indexOf(x),1);persist(true);if(fromShop){const row=[...document.querySelectorAll('#shopArea [data-uid]')].find(el=>el.dataset.uid===uid);if(row){if(x.qty<=0)row.remove();else{row.querySelector('.shop-name').textContent=ITEMS[x.id].name+' ×'+x.qty;row.querySelector('.shop-price').textContent=fmt(saleUnit(x)*x.qty)+' G'}}const header=document.querySelector('.shop-head .gold');if(header)header.textContent='보유 골드: '+fmt(c.gold)+' G';if(!document.querySelector('#shopArea [data-uid]'))$('shopArea').innerHTML='<p class="muted">판매 가능한 아이템이 없습니다.</p>'}else openModal('inventory')}

function lockItem(uid){const x=ccur().inv.find(i=>i.uid===uid);if(x)x.locked=!x.locked;persist();openModal('inventory')}
function shopTab(t){
 shopCategory=t;const a=$('shopArea'),c=ccur();if(!a)return;
 for(const id of ['potion','scroll','weapon','armor','material','sell'])$('shop-tab-'+id)?.classList.toggle('active',id===t);
 if(t==='sell'){
  const available=c.inv.filter(x=>!x.locked&&!Object.values(c.equip).includes(x.uid));
  a.innerHTML=available.length?available.map(x=>`<div class="shop-row" data-uid="${x.uid}"><div class="shop-name">${esc(ITEMS[x.id].name)} ${x.qty>1?'×'+x.qty:''}</div><div class="shop-actions"><b class="shop-price">${fmt(saleUnit(x)*x.qty)} G</b><button onclick="sellItem('${x.uid}',true)">판매</button></div></div>`).join(''):'<p class="muted">판매 가능한 아이템이 없습니다.</p>';return;
 }
 const ids={potion:['red','orange','clear','green','enhgreen'],scroll:['day','zel'],weapon:['s0','s1','b0','b1'],armor:['a0','a7','h0'],material:['iron','leather','wood','mithril','oriharukon','material']}[t]||[];
 const bulk=['potion','scroll','material'].includes(t);
 a.innerHTML=(bulk?`<div class="row bulk-controls"><b>구매 수량</b>${[1,10,100].map(n=>`<button class="${shopQty===n?'active':''}" onclick="shopQty=${n};shopTab('${t}')">×${n}</button>`).join('')}</div>`:'')+ids.map(id=>`<div class="shop-row"><div class="shop-name"><span class="shop-art">${itemArt(id)}</span><span>${esc(ITEMS[id].name)}</span></div><div class="shop-actions"><b class="shop-price">${fmt(ITEMS[id].price*(bulk?shopQty:1))} G</b><button ${c.gold<ITEMS[id].price*(bulk?shopQty:1)?'disabled':''} onclick="buy('${id}',${bulk?shopQty:1})">구매</button></div></div>`).join('');
}
function buy(id,qty=1){const c=ccur(),it=ITEMS[id];qty=Math.max(1,Math.min(100,Number(qty)||1));const price=it.price*qty;if(c.gold<price)return toast('골드 부족');if(it.weight&&weight(c)+it.weight*qty>derived(c).maxWeight)return toast('물약 무게 초과');if(!add(c,id,qty))return toast('인벤토리가 가득 참');c.gold-=price;c.statsLife.spent+=price;persist(true);renderModal('shop')}

function deposit(uid){const c=ccur(),x=c.inv.find(i=>i.uid===uid);if(!x||(game.warehouse.length>=200&&!game.warehouse.some(y=>y.id===x.id&&['consumable','material','scroll','ticket'].includes(ITEMS[x.id].slot)))||Object.values(c.equip).includes(uid))return toast('장착 중인 장비는 해제한 뒤 보관하세요');c.inv.splice(c.inv.indexOf(x),1);const old=game.warehouse.find(y=>y.id===x.id&&['consumable','material','scroll','ticket'].includes(ITEMS[x.id].slot));if(old)old.qty+=x.qty;else game.warehouse.push(x);persist(true);openModal('warehouse')}
function withdraw(uid){const c=ccur(),x=game.warehouse.find(i=>i.uid===uid);if(!x||(c.inv.length>=200&&!c.inv.some(y=>y.id===x.id&&['consumable','material','scroll','ticket'].includes(ITEMS[x.id].slot))))return toast('인벤토리 공간 부족');if(ITEMS[x.id].weight&&weight(c)+ITEMS[x.id].weight*x.qty>derived(c).maxWeight)return toast('물약 무게 초과');game.warehouse.splice(game.warehouse.indexOf(x),1);const old=c.inv.find(y=>y.id===x.id&&['consumable','material','scroll','ticket'].includes(ITEMS[x.id].slot));if(old)old.qty+=x.qty;else c.inv.push(x);persist(true);openModal('warehouse')}
function itemSources(id){const sources=[];for(let z=0;z<10;z++){const monsters=ZONES[z][6],list=ZONE_LOOT[z]||[];list.forEach((it,i)=>{if(it===id&&id!=='r9')sources.push(`${ZONES[z][0]} · ${monsters[i%monsters.length]}`)});if((BOSS_LOOT[z]||[]).includes(id))sources.push(`${ZONES[z][0]} · [보스] ${ZONES[z][7]}`)}if(id==='r9')sources.push('용의 계곡 · 오우거');if(id==='ogreblood')sources.push('용의 계곡 · 오우거');if(id==='bday'||id==='bzel')sources.push('오만의 탑 / 화룡의 둥지 / 잊혀진 섬 · 모든 몬스터');if(['red','material','zel','day'].includes(id))sources.push('사냥터 몬스터 공통 드롭');if(id==='wafer')sources.push('요정의 숲 이후 몬스터');if(Object.values(RECIPES).length&&RECIPES[id])sources.push('제작');if(['red','orange','clear','green','enhgreen','day','zel','s0','s1','b0','b1','a0','a7','h0','iron','leather','wood','mithril','oriharukon','material'].includes(id))sources.push('상점 구매');return [...new Set(sources)]}
function moveAllToWarehouse(){const c=ccur();let n=0;for(const x of [...c.inv]){if(game.warehouse.length>=200&&!game.warehouse.some(y=>y.id===x.id&&['consumable','material','scroll','ticket'].includes(ITEMS[x.id].slot)))break;if(x.locked||Object.values(c.equip).includes(x.uid))continue;c.inv.splice(c.inv.indexOf(x),1);const old=game.warehouse.find(y=>y.id===x.id&&['consumable','material','scroll','ticket'].includes(ITEMS[x.id].slot));if(old)old.qty+=x.qty;else game.warehouse.push(x);n++}persist(true);renderModal('warehouse');toast(n+'개 슬롯 보관 완료')}
function moveAllToInventory(){const c=ccur();let n=0;for(const x of [...game.warehouse]){if(c.inv.length>=200&&!c.inv.some(y=>y.id===x.id&&['consumable','material','scroll','ticket'].includes(ITEMS[x.id].slot)))break;if(x.locked)continue;if(ITEMS[x.id].weight&&weight(c)+ITEMS[x.id].weight*x.qty>derived(c).maxWeight)continue;game.warehouse.splice(game.warehouse.indexOf(x),1);const old=c.inv.find(y=>y.id===x.id&&['consumable','material','scroll','ticket'].includes(ITEMS[x.id].slot));if(old)old.qty+=x.qty;else c.inv.push(x);n++}persist(true);renderModal('warehouse');toast(n+'개 슬롯 꺼내기 완료')}
function filterCodex(){const n=$('codexList');if(!n)return;const q=($('codexSearch')?.value||'').toLowerCase();n.innerHTML=Object.values(ITEMS).filter(it=>category(it.id)&&(codexCategory==='전체'||category(it.id)===codexCategory)&&it.name.toLowerCase().includes(q)).map(it=>`<div class="codex-entry"><div class="listrow"><span>${esc(it.name)}</span><span>${game.codex[it.id]!==undefined?'✓ 최고 +'+game.codex[it.id]:'미획득'}</span></div>${game.codex[it.id]!==undefined?`<small class="muted">획득처: ${esc(itemSources(it.id).join(' / ')||'확인된 획득처 없음')}</small>`:''}</div>`).join('')}

function craft(id){const c=ccur(),r=RECIPES[id];if(!r)return;const req=Object.entries(r.materials);if(c.gold<r.gold||req.some(([m,q])=>count(c,m)<q))return toast('재료 또는 골드 부족');if(!add(c,id))return toast('인벤토리 공간 부족');for(const [m,q] of req)consume(c,m,q);c.gold-=r.gold;persist(true);openModal('craft');toast(ITEMS[id].name+' 제작 완료')}
function safeEnchant(it){return it.slot==='weapon'?6:(it.name.includes('요정족')||it.name==='엘름의 축복'?6:4)}
function enhance(uid,blessed=false){const c=ccur(),x=c.inv.find(i=>i.uid===uid),it=ITEMS[x?.id];if(!x||!it)return;const isW=it.slot==='weapon',scroll=(blessed?'b':'')+(isW?'day':'zel'),safe=safeEnchant(it),rate=isW?{6:35,7:20,8:10,9:5}:{4:40,5:30,6:20,7:12,8:6,9:3};if(x.enh>=10)return toast('최대 강화 +10');if(count(c,scroll)<1)return toast('강화 주문서 부족');if(x.locked)return toast('잠금 해제 후 강화하세요');if(Object.values(c.equip).includes(uid))return toast('장착 해제 후 강화할 수 있습니다');consume(c,scroll);const success=x.enh<safe||Math.random()*100<(rate[x.enh]??(x.enh===6?20:0));if(success){x.enh++;discover(x.id,x.enh);toast('강화 성공 +'+x.enh)}else if(blessed&&Math.random()<.05/(1-(rate[x.enh]??(x.enh===6?20:0))/100)){toast('축복 주문서 보호 성공: 장비 유지')}else{for(const slot in c.equip)if(c.equip[slot]===uid)delete c.equip[slot];c.inv.splice(c.inv.indexOf(x),1);toast('강화 실패: 아이템 소멸')}healMax(c);persist(true);openModal('enhance')}

function filterAutoSell(){const q=($('sellSearch')?.value||'').trim();document.querySelectorAll('.sell-choice').forEach(x=>x.style.display=x.dataset.name.includes(q)?'block':'none')}
function toggleAutoSellId(id,enabled){const s=ccur().settings;const a=new Set(s.autoSellIds||[]);enabled?a.add(id):a.delete(id);s.autoSellIds=[...a];persist(true)}
function setBuffSetting(key,value){const c=ccur();if(value&&key==='greenAutoUse')c.settings.enhgreenAutoUse=false;if(value&&key==='enhgreenAutoUse')c.settings.greenAutoUse=false;setSetting(key,value);renderModal('hunt')}
function setSetting(key,value){const c=ccur();c.settings[key]=value;persist()}
function presetSave(i){const c=ccur();c.presets[i]=structuredClone(c.settings);persist(true);toast('프리셋 '+(i+1)+' 저장')}
function presetLoad(i){const c=ccur();if(!c.presets[i])return toast('저장된 프리셋이 없습니다');c.settings=structuredClone(c.presets[i]);persist(true);renderModal('hunt');toast('프리셋 불러옴')}
function exportSave(){persist(true);const blob=new Blob([JSON.stringify({mode,game,exported:Date.now()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`퇴개RPG_${mode}_${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}
async function importSave(file){if(!file)return;try{const obj=JSON.parse(await file.text());if(obj.mode!==mode||!obj.game||!Array.isArray(obj.game.chars)||obj.game.chars.length<1||obj.game.chars.length>3||obj.game.chars.some(c=>c&&(!Array.isArray(c.inv)||c.inv.some(x=>!ITEMS[x.id]||!x.uid||!Number.isFinite(x.qty)))))throw Error('모드 또는 데이터 구조가 일치하지 않습니다');if(!confirm('현재 게임 데이터를 덮어씁니다. 계속할까요?'))return;persist(true);game=obj.game;game.chars=game.chars.slice(0,3);while(game.chars.length<3)game.chars.push(null);game.easterEggs ||= {};for(const c of game.chars)if(c)normalizeChar(c);persist(true);closeModal();render();toast('불러오기 완료')}catch(e){toast('불러오기 실패: '+e.message)}}
function restoreBackup(i){const v=safeParse(localStorage.getItem(saveKey()+'_bak'+i));if(!v||!Array.isArray(v.chars))return toast('백업이 없습니다');if(!confirm('현재 데이터를 백업 '+i+'로 복원할까요?'))return;game=v;for(const c of game.chars)if(c)normalizeChar(c);persist();closeModal();render();toast('백업 복구 완료')}
window.addEventListener('beforeunload',()=>persist());document.addEventListener('visibilitychange',()=>{if(document.hidden)persist()});setInterval(()=>{if(game)persist(true)},30000);modeScreen();requestAnimationFrame(loop);
</script></body></html>
